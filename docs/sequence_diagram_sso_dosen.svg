<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 34px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #536172; }
      .lane { fill: #ffffff; stroke: #cdd7e5; stroke-width: 2; }
      .lane-title { font: 700 18px Arial, sans-serif; fill: #172033; }
      .lane-subtitle { font: 400 13px Arial, sans-serif; fill: #64748b; }
      .lifeline { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; }
      .arrow { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-green { stroke: #15803d; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-green); }
      .arrow-orange { stroke: #b45309; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-orange); }
      .arrow-red { stroke: #b91c1c; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-red); }
      .msg { font: 500 15px Arial, sans-serif; fill: #172033; }
      .note { fill: #fff7ed; stroke: #fed7aa; stroke-width: 2; }
      .note-text { font: 500 15px Arial, sans-serif; fill: #7c2d12; }
      .box { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; }
      .box-text { font: 600 15px Arial, sans-serif; fill: #1e3a8a; }
      .alt { fill: #fef2f2; stroke: #fecaca; stroke-width: 2; stroke-dasharray: 6 6; }
      .alt-text { font: 700 15px Arial, sans-serif; fill: #991b1b; }
      .footer { font: 400 14px Arial, sans-serif; fill: #64748b; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#15803d"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#b45309"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="980"/>

  <text class="title" x="60" y="60">Sequence Diagram Integrasi Tugas 3 - Vehicle-Service</text>
  <text class="subtitle" x="60" y="90">Interaksi layanan dengan sistem terpusat: SSO Dosen, Legacy SOAP/XML, dan RabbitMQ</text>

  <rect class="lane" x="60" y="125" width="190" height="70" rx="8"/>
  <text class="lane-title" x="96" y="154">Admin</text>
  <text class="lane-subtitle" x="84" y="178">Dispatching</text>

  <rect class="lane" x="305" y="125" width="190" height="70" rx="8"/>
  <text class="lane-title" x="340" y="154">SSO Dosen</text>
  <text class="lane-subtitle" x="336" y="178">Cloud Identity</text>

  <rect class="lane" x="550" y="125" width="210" height="70" rx="8"/>
  <text class="lane-title" x="595" y="154">Vehicle-Service</text>
  <text class="lane-subtitle" x="588" y="178">Laravel 11 API</text>

  <rect class="lane" x="815" y="125" width="190" height="70" rx="8"/>
  <text class="lane-title" x="860" y="154">Database</text>
  <text class="lane-subtitle" x="850" y="178">Roles & Vehicles</text>

  <rect class="lane" x="1060" y="125" width="200" height="70" rx="8"/>
  <text class="lane-title" x="1095" y="154">Legacy SOAP</text>
  <text class="lane-subtitle" x="1098" y="178">Audit Dosen</text>

  <rect class="lane" x="1310" y="125" width="160" height="70" rx="8"/>
  <text class="lane-title" x="1330" y="154">RabbitMQ</text>
  <text class="lane-subtitle" x="1334" y="178">Event Broker</text>

  <line class="lifeline" x1="155" y1="195" x2="155" y2="895"/>
  <line class="lifeline" x1="400" y1="195" x2="400" y2="895"/>
  <line class="lifeline" x1="655" y1="195" x2="655" y2="895"/>
  <line class="lifeline" x1="910" y1="195" x2="910" y2="895"/>
  <line class="lifeline" x1="1160" y1="195" x2="1160" y2="895"/>
  <line class="lifeline" x1="1390" y1="195" x2="1390" y2="895"/>

  <line class="arrow" x1="155" y1="245" x2="400" y2="245"/>
  <text class="msg" x="190" y="235">1. Login ke Cloud SSO Dosen</text>

  <line class="arrow-green" x1="400" y1="295" x2="155" y2="295"/>
  <text class="msg" x="185" y="285">2. SSO mengirim JWT</text>
  <text class="msg" x="185" y="308">payload: sub, name, email, roles</text>

  <line class="arrow" x1="155" y1="360" x2="655" y2="360"/>
  <text class="msg" x="190" y="350">3. POST /api/v1/vehicles/{id}/dispatch</text>
  <text class="msg" x="190" y="373">Authorization: Bearer JWT</text>

  <rect class="box" x="535" y="395" width="240" height="62" rx="8"/>
  <text class="box-text" x="568" y="420">4. Decode JWT</text>
  <text class="box-text" x="568" y="440">Validasi role lokal</text>

  <line class="arrow" x1="655" y1="495" x2="910" y2="495"/>
  <text class="msg" x="685" y="485">5. Upsert sso_users</text>
  <text class="msg" x="685" y="508">dan mapping roles lokal</text>

  <line class="arrow-green" x1="910" y1="545" x2="655" y2="545"/>
  <text class="msg" x="690" y="535">6. Role ditemukan:</text>
  <text class="msg" x="690" y="558">fleet_admin / dispatch_admin</text>

  <line class="arrow" x1="655" y1="605" x2="910" y2="605"/>
  <text class="msg" x="690" y="595">7. Cek kendaraan</text>
  <text class="msg" x="690" y="618">status harus Available</text>

  <rect class="alt" x="520" y="642" width="450" height="72" rx="8"/>
  <text class="alt-text" x="545" y="670">Jika role tidak valid / kendaraan tidak Available:</text>
  <text class="alt-text" x="545" y="694">Vehicle-Service mengembalikan 403 / 404 / 409</text>

  <line class="arrow-orange" x1="655" y1="750" x2="1160" y2="750"/>
  <text class="msg" x="705" y="740">8. Kirim SOAP XML Envelope</text>
  <text class="msg" x="705" y="763">ValidateVehicleDispatch</text>

  <line class="arrow-green" x1="1160" y1="805" x2="655" y2="805"/>
  <text class="msg" x="730" y="795">9. Response SOAP berisi ReceiptNumber</text>

  <line class="arrow" x1="655" y1="850" x2="910" y2="850"/>
  <text class="msg" x="690" y="840">10. Simpan dispatch, ReceiptNumber,</text>
  <text class="msg" x="690" y="863">ubah status kendaraan menjadi In-Use</text>

  <line class="arrow-orange" x1="655" y1="900" x2="1390" y2="900"/>
  <text class="msg" x="735" y="890">11. Publish event JSON: vehicle.dispatched</text>

  <rect class="note" x="60" y="770" width="405" height="105" rx="8"/>
  <text class="note-text" x="82" y="802">Transaksi kritis:</text>
  <text class="note-text" x="82" y="826">Penugasan kendaraan mengubah status</text>
  <text class="note-text" x="82" y="850">Available menjadi In-Use, sehingga perlu</text>
  <text class="note-text" x="82" y="874">SSO, audit SOAP, dan notifikasi RabbitMQ.</text>

  <text class="footer" x="60" y="945">Vehicle-Service Tiara - Tugas 3 Integrasi Aplikasi Enterprise</text>
</svg>
